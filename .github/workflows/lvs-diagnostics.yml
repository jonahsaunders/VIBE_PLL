name: Inspect saved LVS report

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: Standalone route workflow run ID
        default: '43485032506'
        required: true
      recheck:
        description: Re-extract and compare the saved full-chip layout
        type: boolean
        default: false
  push:
    branches: [physical-bringup]
    paths: ['physical/diagnose_lvs.py', '.github/workflows/lvs-diagnostics.yml']

permissions:
  contents: read
  actions: read

jobs:
  inspect:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.event.head_commit.message, 'Diagnose ')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
      RUN_ID: ${{ inputs.run_id || '43485032506' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Check verifier syntax
        run: python3 -m py_compile physical/check_dco.py physical/check_layout.py tests/check_diode_guard.py
      - name: Inspect artifact connectivity
        run: |
          gh run download "$RUN_ID" --name sky130-standalone --dir build/inspect
          python3 - <<'PY'
          from pathlib import Path
          path = Path("build/inspect/sky130-portable.lvs")
          print("ACTUAL PINNED DECK DIODE RULES")
          for number, line in enumerate(path.read_text().splitlines(), 1):
              if (920 <= number <= 1000) or (1600 <= number <= 1660) or ("sub" in line and ("=" in line or "connect" in line)) or "class Diode" in line:
                  print(number, line)
          PY
          python3 -m venv "$RUNNER_TEMP/lvs-inspect"
          "$RUNNER_TEMP/lvs-inspect/bin/pip" install klayout==0.30.13
          "$RUNNER_TEMP/lvs-inspect/bin/python" physical/diagnose_lvs.py build/inspect/pll-lvs.lvsdb
      - name: Recheck saved full-chip geometry and diode extraction
        if: (github.event_name == 'workflow_dispatch' && inputs.recheck) || startsWith(github.event.head_commit.message, 'Diagnose current')
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq zstd
          curl -fsSL --retry 3 https://www.klayout.org/downloads/Ubuntu-24/klayout_0.30.13-1_amd64.deb -o "$RUNNER_TEMP/klayout.deb"
          echo "ce86dbab94a1dd92bb293cfd86f8e97e  $RUNNER_TEMP/klayout.deb" | md5sum -c -
          sha256sum "$RUNNER_TEMP/klayout.deb"
          sudo apt-get install -y -qq "$RUNNER_TEMP/klayout.deb"
          klayout -v
          mkdir -p build/pdk
          curl -fsSL --retry 3 https://github.com/chipfoundry/volare/releases/download/sky130-fa87f8f4bbcc7255b6f0c0fb506960f531ae2392/common.tar.zst | tar --zstd -x -C build/pdk
          "$RUNNER_TEMP/lvs-inspect/bin/python" physical/check_layout.py --pdk build/pdk/sky130A --build build/inspect --geometry-mode deep
          "$RUNNER_TEMP/lvs-inspect/bin/python" tests/check_diode_guard.py --pdk build/pdk/sky130A --build build/inspect
      - name: Show recheck evidence
        if: always()
        run: |
          cat build/inspect/physical-verification.json
          grep 'JUNCTION' build/inspect/pll-lvs.log || true
          tail -40 build/inspect/pll-lvs.log
          "$RUNNER_TEMP/lvs-inspect/bin/python" physical/diagnose_lvs.py build/inspect/pll-lvs.lvsdb
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: lvs-inspection
          path: build/inspect


