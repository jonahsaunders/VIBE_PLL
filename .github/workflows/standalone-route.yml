name: Sky130 standalone route

on:
  pull_request:
    paths-ignore:
      - '**/*.md'
  workflow_dispatch:
  push:
    branches: [main, physical-bringup, codex/rev4-phase-detector]
    paths-ignore:
      - '**/*.md'

permissions:
  contents: read
  actions: read

jobs:
  rtl:
    if: "!startsWith(github.event.head_commit.message, 'Diagnose ')"
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Preserve PLL features
        run: |
          mkdir -p build/rtl
          sudo apt-get update -qq
          sudo apt-get install -y -qq iverilog
          python3 tests/check_phase_tables.py --tt results/range-dco/tt-40-64.csv --ss results/range-dco/ss-136-64.csv
          python3 tests/run_rtl.py --fixed-centers --report build/rtl/fixed.json
          python3 tests/run_rtl.py --fixed-centers --corner-grid --report build/rtl/corners.json
          python3 tests/run_rtl.py --report build/rtl/calibration.json
          python3 tests/run_rtl.py --fixed-centers --tracking-replicas --spice-data results/rev2-tt.csv --phase-shape results/rev4-tt-tracking-probe.csv --report build/rtl/tracking.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: sky130-rtl
          path: build/rtl
  oscillator:
    if: "!startsWith(github.event.head_commit.message, 'Diagnose ')"
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Build headless Magic and install the Sky130A models
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq tcl-dev ngspice zstd
          sudo bash physical/install_klayout.sh
          mkdir -p "$RUNNER_TEMP/magic-src" "$RUNNER_TEMP/sky130"
          curl -fsSL --retry 3 \
            https://codeload.github.com/RTimothyEdwards/magic/tar.gz/8d37ad4cb49a839eb3e32016f1c06e9bca20d8ef \
            | tar xz --strip-components=1 -C "$RUNNER_TEMP/magic-src"
          (
            cd "$RUNNER_TEMP/magic-src"
            ./configure --prefix="$RUNNER_TEMP/magic" --disable-readline \
              --without-x --without-opengl --without-cairo --without-tk
            make -j4
            make install
          ) > "$RUNNER_TEMP/magic-build.log" 2>&1 || {
            tail -80 "$RUNNER_TEMP/magic-build.log"
            exit 1
          }
          release=https://github.com/chipfoundry/volare/releases/download/sky130-fa87f8f4bbcc7255b6f0c0fb506960f531ae2392
          for asset in common sky130_fd_pr; do
            curl -fsSL --retry 3 "$release/$asset.tar.zst" | tar --zstd -x -C "$RUNNER_TEMP/sky130"
          done
      - name: Extract the oscillator and check tuning endpoints
        run: |
          mkdir -p build/oscillator
          python3 -m venv "$RUNNER_TEMP/vibe-oscillator"
          python="$RUNNER_TEMP/vibe-oscillator/bin/python"
          "$python" -m pip install klayout==0.30.13
          "$python" spice/dco_deck.py --tracking-replicas --range-dco --emit build/oscillator/source.spice
          "$python" physical/layout_dco.py --schematic build/oscillator/source.spice --output build/oscillator
          "$python" physical/check_dco.py --pdk "$RUNNER_TEMP/sky130/sky130A" --build build/oscillator
          "$python" tests/check_physical_guards.py --pdk "$RUNNER_TEMP/sky130/sky130A" --build build/oscillator
          export PDK_ROOT="$RUNNER_TEMP/sky130"
          export PATH="$RUNNER_TEMP/magic/bin:$PATH"
          (
            cd build/oscillator
            magic -dnull -noconsole -rcfile "$PDK_ROOT/sky130A/libs.tech/magic/sky130A.magicrc" \
              "$GITHUB_WORKSPACE/physical/extract_dco.tcl"
          ) 2>&1 | tee build/oscillator/magic-pex.log
          test -s build/oscillator/cpz4_dco_pex.spice
          model="$PDK_ROOT/sky130A/libs.tech/ngspice/sky130.lib.spice"
          pex=build/oscillator/cpz4_dco_pex.spice
          "$python" spice/dco_deck.py --lib "$model" --netlist "$pex" \
            --codes 52 --fine-codes 64 --output build/oscillator/pex-tt.csv &
          nominal=$!
          "$python" spice/dco_deck.py --lib "$model" --netlist "$pex" \
            --codes 255 --fine-codes 128 --output build/oscillator/pex-tt-max.csv &
          typical=$!
          "$python" spice/dco_deck.py --lib "$model" --netlist "$pex" \
            --corner ss --vdd 1.62 --temp 0 --codes 255 --fine-codes 128 \
            --output build/oscillator/pex-ss-max.csv &
          slow=$!
          failed=0
          for pid in "$nominal" "$typical" "$slow"; do wait "$pid" || failed=1; done
          test "$failed" = 0
          test -s build/oscillator/pex-tt.csv
          test -s build/oscillator/pex-tt-max.csv
          test -s build/oscillator/pex-ss-max.csv
      - name: Upload oscillator extraction
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: sky130-oscillator
          path: build/oscillator
          if-no-files-found: warn
  route:
    if: "!startsWith(github.event.head_commit.message, 'Diagnose ')"
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Route standalone PLL
        timeout-minutes: 80
        run: |
          mkdir -p build/standalone build/pdk
          release=https://github.com/chipfoundry/volare/releases/download/sky130-fa87f8f4bbcc7255b6f0c0fb506960f531ae2392
          for asset in common sky130_fd_pr sky130_fd_sc_hd; do
            curl -fsSL --retry 3 "$release/$asset.tar.zst" | tar --zstd -x -C build/pdk
          done
          docker run --rm --platform linux/amd64 \
            --volume "$GITHUB_WORKSPACE:/project" --workdir /project \
            --env SKY130A=/project/build/pdk/sky130A \
            --entrypoint /bin/bash \
            openroad/orfs@sha256:73275384ed91270ea0e5f47710b3c2ff1b91708440c0744208ff226b751f88a0 \
            -lc 'set -euo pipefail;
                 apt-get update -qq;
                 bash physical/install_klayout.sh;
                 export PATH="/OpenROAD-flow-scripts/tools/install/OpenROAD/bin:/OpenROAD-flow-scripts/tools/install/yosys/bin:$PATH";
                 if ! command -v openroad; then
                   binary=$(find /OpenROAD-flow-scripts /opt /usr/local -type f -name openroad -print -quit);
                   test -x "$binary" || exit 127;
                   export OPENROAD="$binary";
                 fi;
                 python3 -m venv /tmp/vibe-layout &&
                 /tmp/vibe-layout/bin/pip install klayout==0.30.13 &&
                 PYTHON=/tmp/vibe-layout/bin/python bash physical/run_standalone.sh build/standalone &&
                 /tmp/vibe-layout/bin/python tests/check_diode_guard.py --build build/standalone --pdk "$SKY130A"'
      - name: Summarize verification diagnostics
        if: always()
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from collections import Counter
          import xml.etree.ElementTree as ET
          root = Path("build/standalone")
          for name in ("physical-verification.json", "route-checks.txt", "route-violations.txt"):
              path = root / name
              if path.exists():
                  print(name + ":")
                  print(path.read_text())
          path = root / "pll-drc.lyrdb"
          if path.exists():
              report = ET.parse(path)
              items = report.findall("./items/item")
              print("DRC categories:", dict(Counter(i.findtext("category") for i in items)))
              for item in items[:25]:
                  print("DRC marker:", " ".join(item.itertext())[:500])
          path = root / "pll-lvs.log"
          if path.exists():
              print("LVS log tail:")
              print("\n".join(path.read_text().splitlines()[-30:]))
          PY
      - name: Evaluate routed timing
        if: always()
        continue-on-error: true
        run: python3 physical/check_timing.py build/standalone
      - name: Upload route outputs and diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: sky130-standalone
          path: build/standalone
          if-no-files-found: warn

  extracted-replay:
    needs: oscillator
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        include:
          - {corner: tt, ceiling: 64, stride: 16, extra: '37 38 40 52 53'}
          - {corner: ss, ceiling: 192, stride: 32, extra: '136 159 169 170'}
          - {corner: ff, ceiling: 48, stride: 12, extra: '23 25 31 32'}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Install the simulator and matching device models
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq iverilog ngspice python3-numpy zstd
          release=https://github.com/chipfoundry/volare/releases/download/sky130-fa87f8f4bbcc7255b6f0c0fb506960f531ae2392
          mkdir -p build/pdk
          for asset in common sky130_fd_pr; do
            curl -fsSL --retry 3 "$release/$asset.tar.zst" | tar --zstd -x -C build/pdk
          done
      - name: Download this build's oscillator extraction
        run: gh run download "$GITHUB_RUN_ID" --name sky130-oscillator --dir build/oscillator
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Measure tuning and tap phase
        env:
          OMP_NUM_THREADS: '1'
        run: |
          python3 tests/qualify_pex.py sweep --corner ${{ matrix.corner }} --ceiling ${{ matrix.ceiling }} \
            --stride ${{ matrix.stride }} --extra-codes ${{ matrix.extra }} --jobs 2 \
            --netlist build/oscillator/cpz4_dco_pex.spice --output build/replay \
            --lib build/pdk/sky130A/libs.tech/ngspice/sky130.lib.spice
      - name: Check lock, dropout, recovery, and both detectors
        run: /usr/bin/python3 tests/qualify_pex.py replay --sampled --output build/replay
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: replay-${{ matrix.corner }}
          path: build/replay

  qualification:
    needs: [rtl, oscillator, route, extracted-replay]
    if: always() && needs.route.result != 'skipped'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Collect available build results
        run: gh run download "$GITHUB_RUN_ID" --dir build/artifacts
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Publish measured limits
        run: |
          python3 physical/build_summary.py build/artifacts --commit "$GITHUB_SHA" --output build/summary
          cat build/summary/summary.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pll-summary
          path: build/summary
      - name: Require geometry, RTL, endpoint range and timing
        env:
          RTL: ${{ needs.rtl.result }}
          OSC: ${{ needs.oscillator.result }}
          ROUTE: ${{ needs.route.result }}
          REPLAY: ${{ needs.extracted-replay.result }}
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          data = json.loads(Path("build/summary/summary.json").read_text())
          upper = {r["corner"]: r for r in data["probes"] if (r["code"], r["fine_code"]) == ("255", "128")}
          passed = (all(os.environ[k] == "success" for k in ("RTL", "OSC", "ROUTE", "REPLAY"))
                    and data["physical"].get("passed") and data["timing"].get("passed")
                    and data["area"].get("planning_fit") and data["replays_match_extraction"]
                    and all(r.get("sampled_pass") for r in data["extracted_replays"].values())
                    and set(upper) == {"tt", "ss"}
                    and all(float(r["frequency_mhz"]) >= 300 and int(r["bad_tap_sequences"]) == 0
                            for r in upper.values()))
          if not passed:
              raise SystemExit("Standalone qualification failed; see the measured limits above.")
          PY
